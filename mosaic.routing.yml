mosaic:
  path: '/services/mosaic'
  defaults:
    _controller: '\Drupal\mosaic\Controller\MosaicController::render'
    _title: 'Mosaic Tool'
  requirements:
    _permission: 'access content'

mosaic.results:
  path: '/services/mosaic/results'
  defaults:
    _controller: '\Drupal\mosaic\Controller\MosaicController::results'
  requirements:
    _permission: 'access content'
  options:
    _htmx_route: true

metsis.services:
  path: '#'
  defaults:
    _title: 'Services'
  requirements:
    _permission: 'access content'
